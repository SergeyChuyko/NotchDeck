name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26.x found on this runner; falling back to default." >&2
            xcodebuild -version
          else
            sudo xcode-select -s "$XCODE_PATH"
          fi

      - name: Build (ad-hoc signed, no dev account needed)
        run: |
          xcodebuild -project NotchDeck.xcodeproj \
            -target NotchDeck \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CONFIGURATION_BUILD_DIR=build \
            build

      - name: Zip app
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent NotchDeck.app "$GITHUB_WORKSPACE/NotchDeck.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: NotchDeck.zip
          body: |
            Приложение не подписано Apple Developer ID (нет платного аккаунта),
            поэтому macOS при первом запуске скажет, что файл «не был открыт».

            Как открыть:

            <img src="https://raw.githubusercontent.com/SergeyChuyko/NotchDeck/${{ github.sha }}/Docs/media/gatekeeper-blocked.png" width="310" alt="Диалог «Файл «NotchDeck» не был открыт»" />

            1. Нажмите «Готово» в этом диалоге, затем откройте Системные
               настройки → Конфиденциальность и безопасность:

            <img src="https://raw.githubusercontent.com/SergeyChuyko/NotchDeck/${{ github.sha }}/Docs/media/gatekeeper-settings-path.png" width="240" alt="Конфиденциальность и безопасность" />

            2. Прокрутите вниз до блока «Безопасность» — там будет строка
               «Файл «NotchDeck» заблокирован для защиты Вашего Mac». Нажмите
               «Все равно открыть» и подтвердите ещё раз в диалоге.

            <img src="https://raw.githubusercontent.com/SergeyChuyko/NotchDeck/${{ github.sha }}/Docs/media/gatekeeper-open-anyway.png" width="480" alt="Блок «Безопасность» с кнопкой «Все равно открыть»" />
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
